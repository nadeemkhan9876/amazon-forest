name: CI security checks

on:
  push:
    branches: [main]          # BLANK 1
  pull_request:

permissions:
  contents: read
  pull-requests: read


jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # BLANK 2

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Scan Terraform for insecure settings
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: infra-terraform            # BLANK 1
          severity: "HIGH,CRITICAL"           # BLANK 2
          exit-code: '1'         # BLANK 3
          format: table

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t learningsteps-api:ci app

      - name: Scan the image for vulnerable packages
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: learningsteps-api:ci
          severity: "HIGH,CRITICAL"
          exit-code: '1'
          format: table
          ignore-unfixed: true

  push-to-ecr:
    needs: [secret-scan, terraform-scan, image-scan]   # waits for all three guards to pass
    if: github.event_name == 'push'                    # only for pushes to main, never for pull requests
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # lets this run ask GitHub for the signed "badge"
      contents: read
    steps:
      - name: Get the code
        uses: actions/checkout@v4


      - name: Get temporary AWS keys (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::518285921450:role/amazon-new-github-actions-role    # hint 1: the role ARN from your Terraform output
          aws-region: eu-central-1        # hint 2: our region

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/learningsteps-api:${{ github.sha }}
          docker build -t $IMAGE app
          docker push $IMAGE