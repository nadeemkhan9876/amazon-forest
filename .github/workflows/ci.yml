name: CI security checks

on:
  push:
    branches: [main]          # BLANK 1
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # BLANK 2

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Scan Terraform for insecure settings
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: config
          scan-ref: infra-terraform            # BLANK 1
          severity: "HIGH,CRITICAL"           # BLANK 2
          exit-code: '1'         # BLANK 3
          format: table

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build -t learningsteps-api:ci app

      - name: Scan the image for vulnerable packages
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: image
          image-ref: learningsteps-api:ci
          severity: "HIGH,CRITICAL"
          exit-code: '1'
          format: table
          ignore-unfixed: true